# Push a tag like v1.2.0 (matching shuffle_solver.__version__) to test, build and publish
# CardApp-Setup-1.2.0.exe plus its .sha256 as a GitHub Release. The app's update check
# reads the latest release and those two assets.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check the tag matches the app version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import shuffle_solver; print(shuffle_solver.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} doesn't match __version__ $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: python -m pytest -q

      - name: Build app folder
        run: pyinstaller --noconfirm CardApp.spec

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\CardApp.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Checksum
        shell: pwsh
        run: |
          $name = "CardApp-Setup-${{ steps.version.outputs.version }}.exe"
          $hash = (Get-FileHash "dist\$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii -NoNewline "dist\$name.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ github.ref_name }}
          dist/CardApp-Setup-${{ steps.version.outputs.version }}.exe
          dist/CardApp-Setup-${{ steps.version.outputs.version }}.exe.sha256
          --title "Shuffle Solver ${{ steps.version.outputs.version }}"
          --generate-notes
