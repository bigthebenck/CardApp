# Build the phone web app (web/) and publish it to GitHub Pages, at
# https://<owner>.github.io/<repo>/. Runs when the web app or the solver code
# it bundles changes on the default branch, or by hand from the Actions tab.
# Pages must be set to deploy from GitHub Actions (Settings > Pages > Source).
name: Phone app

on:
  push:
    branches: ["claude/card-shuffle-solver-3qkta9"]
    paths: ["web/**", "shuffle_solver/**", "tests/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest  # the same setup as the release tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build web app
        run: python web/build.py  # standard library only
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
